# /etc/app_data_sec.conf
# Конфигурация для eBPF блокировщика доступа к папкам
#
# enable = yes|no - включает или отключает все ограничения
# protect <path> [allowed_prog1] [allowed_prog2] ... - защищает папку
#   path - путь к папке (можно использовать ~ для домашней директории)
#   allowed_prog - абсолютный путь к программе, которая может обходить защиту

enable = yes

# Примеры:
# protect /home/user/.test_app /bin/konsole
# protect ~/.secret_folder /bin/my_app

protect /media/common/dev2/virtual-pc2/ /usr/lib64/virtualbox/VirtualBox /usr/lib64/virtualbox/VBoxSVC /usr/libexec/xdg-desktop-portal-kde
protect /media/common/dev5/Virtual-pc3/ /usr/lib64/virtualbox/VirtualBox /usr/lib64/virtualbox/VBoxSVC /usr/libexec/xdg-desktop-portal-kde
protect "/home/vladimir/VirtualBox VMs/" /usr/lib64/virtualbox/VirtualBox /usr/lib64/virtualbox/VBoxSVC /usr/libexec/xdg-desktop-portal-kde
