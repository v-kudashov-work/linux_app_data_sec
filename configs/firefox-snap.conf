# /etc/app_data_sec.conf
# Конфигурация для eBPF блокировщика доступа к папкам
#
# enable = yes|no - включает или отключает все ограничения
# protect <path> [allowed_prog1] [allowed_prog2] ... - защищает папку
#   path - путь к папке (можно использовать ~ для домашней директории)
#   allowed_prog - абсолютный путь к программе, которая может обходить защиту

enable = yes

# Примеры:
# protect /home/user/.test_app /bin/konsole
# protect ~/.secret_folder /bin/my_app

protect ~/snap/firefox/common/.cache/mozilla/firefox /snap/firefox/current/usr/lib/firefox/firefox /usr/lib/snapd/snapd
protect ~/snap/firefox/common/.mozilla/firefox /snap/firefox/current/usr/lib/firefox/firefox /usr/lib/snapd/snapd
protect ~/snap/firefox/current/.config /snap/firefox/current/usr/lib/firefox/firefox /usr/lib/snapd/snapd
protect ~/snap/firefox/current/.local /snap/firefox/current/usr/lib/firefox/firefox /usr/lib/snapd/snapd

