# /etc/app_data_sec.conf
# Конфигурация для eBPF блокировщика доступа к папкам
#
# enable = yes|no - включает или отключает все ограничения
# protect <path> [allowed_prog1] [allowed_prog2] ... - защищает папку
#   path - путь к папке (можно использовать ~ для домашней директории)
#   allowed_prog - абсолютный путь к программе, которая может обходить защиту

enable = yes

# Примеры:
# protect /home/user/.test_app /bin/konsole
# protect ~/.secret_folder /bin/my_app

protect ~/snap/telegram-desktop/common/.cache/ /usr/lib/snapd/snapd /var/lib/snapd/snap/bin/telegram-desktop /snap/telegram-desktop/current/usr/bin/telegram-desktop
protect ~/snap/telegram-desktop/current/.config/  /usr/lib/snapd/snapd /var/lib/snapd/snap/bin/telegram-desktop /snap/telegram-desktop/current/usr/bin/telegram-desktop
protect ~/snap/telegram-desktop/current/.local/  /usr/lib/snapd/snapd /var/lib/snapd/snap/bin/telegram-desktop /snap/telegram-desktop/current/usr/bin/telegram-desktop
